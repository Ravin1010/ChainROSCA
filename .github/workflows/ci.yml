name: CI

on:
  push:
    branches:
      - main
      - feature/chainrosca
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hardhat:
    name: Hardhat compile and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend JavaScript syntax
        run: |
          node --check static/js/helpers.js
          node --check static/js/app.js

      - name: Run offline frontend tests
        run: node --test tests/test_frontend.js

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test

  backend:
    name: Python backend tests (offline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests -p "test_*.py"
