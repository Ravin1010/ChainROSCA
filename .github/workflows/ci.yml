name: CI

on:
  push:
    branches:
      - main
      - feature/chainrosca
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hardhat:
    name: Hardhat compile and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test
